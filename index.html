<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchWell - Watch Together</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:32px;font-weight:800}
.logo span{color:#8b5cf6}
.logo p{color:#888;margin-top:8px}
.card{background:#16161f;border:1px solid #222;border-radius:16px;padding:28px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:#0f0f15;padding:4px;border-radius:10px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;color:#888;font-weight:600;transition:0.2s}
.tab.active{background:#8b5cf6;color:#fff}
input{width:100%;padding:14px 16px;background:#0f0f15;border:1px solid #222;border-radius:10px;color:#fff;margin-bottom:12px;outline:none}
input:focus{border-color:#8b5cf6}
button.main{width:100%;padding:14px;background:#8b5cf6;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
button.main:disabled{opacity:0.6}
.msg{margin-top:14px;padding:10px;border-radius:8px;font-size:14px;text-align:center;display:none}
.msg.error{background:#2a1215;color:#ff6b6b;display:block}
.msg.success{background:#122a18;color:#4ade80;display:block}
.small{text-align:center;margin-top:16px;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>Watch<span>Well</span></h1>
    <p>Watch together, anywhere</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>
    <input type="email" id="email" placeholder="Email address" />
    <input type="password" id="password" placeholder="Password (min 6 chars)" />
    <input type="text" id="displayName" placeholder="Display name (for register)" style="display:none;" />
    <button class="main" id="submitBtn" onclick="handleAuth()">Login</button>
    <div class="msg" id="msg"></div>
    <div class="small">Firebase: watchwell-73338 • Anyone can register</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3fLCeLfBYThUFIAbAIp8jSyEpkhV5Uak",
  authDomain: "watchwell-73338.firebaseapp.com",
  projectId: "watchwell-73338",
  storageBucket: "watchwell-73338.firebasestorage.app",
  messagingSenderId: "1033589914261",
  appId: "1:1033589914261:web:55c859b3d6f24c8029799c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentTab = 'login';
window.switchTab = (tab) => {
  currentTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('displayName').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('submitBtn').innerText = tab==='register' ? 'Create Account' : 'Login';
  showMsg('', '');
};
function showMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = text ? 'block' : 'none';
}
window.handleAuth = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const displayName = document.getElementById('displayName').value.trim();
  const btn = document.getElementById('submitBtn');
  if(!email || !password){ showMsg('Please enter email and password', 'error'); return; }
  if(password.length < 6){ showMsg('Password must be at least 6 characters', 'error'); return; }
  btn.disabled = true;
  btn.innerText = 'Please wait...';
  showMsg('', '');
  try {
    if(currentTab === 'register'){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if(displayName){ await updateProfile(cred.user, { displayName }); }
      showMsg('✅ Account created! Welcome ' + (displayName || email), 'success');
      switchTab('login');
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      showMsg('✅ Login successful! Welcome ' + (cred.user.displayName || cred.user.email), 'success');
    }
  } catch(err){
    let msg = err.message;
    if(err.code === 'auth/email-already-in-use') msg = 'This email already registered. Please login.';
    if(err.code === 'auth/invalid-email') msg = 'Invalid email address.';
    if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Wrong email or password.';
    if(err.code === 'auth/weak-password') msg = 'Password too weak.';
    if(err.code === 'auth/configuration-not-found') msg = 'Go to Firebase Console > Authentication > Get started > Enable Email/Password';
    showMsg(msg, 'error');
  } finally {
    btn.disabled = false;
    btn.innerText = currentTab==='register' ? 'Create Account' : 'Login';
  }
};
</script>
</body>
</html>
