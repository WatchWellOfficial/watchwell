<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WATCHWELL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;justify-content:space-between;padding:14px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent)}
.logo{font-weight:900;font-size:22px}
.logo span{color:#ff0050}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100vh;position:relative;scroll-snap-align:start;background:#111;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:12px;bottom:150px;display:flex;flex-direction:column;gap:20px;align-items:center}
.btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:22px}
.info{position:absolute;bottom:20px;left:12px;right:80px}
.user{font-weight:900;font-size:15px}
.title{font-size:16px;margin:6px 0;font-weight:700}
.desc{font-size:13px;color:#ccc}
.progress{position:absolute;bottom:0;left:0;height:3px;background:#ff0050}
</style>
</head>
<body>
<div class="header"><div class="logo">WATCH<span>WELL</span></div><div style="font-weight:700">For You</div></div>
<div class="feed" id="feed"></div>
<script>
const MOVIES=[
{title:"WATCHWELL Original - Action Blast",user:"@WatchWellOfficial",likes:"245K",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",desc:"Welcome to WATCHWELL! Swipe up!"},
{title:"Naija Comedy - No Laugh Die",user:"@NaijaMovies",likes:"189K",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",desc:"Best comedy on WATCHWELL"},
{title:"Love & Romance",user:"@LoveHub",likes:"320K",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",desc:"Romance on WATCHWELL"}
];
function render(){
let h="";
MOVIES.forEach((m,i)=>{
h+=`<div class="card" id="card-${i}"><video id="v-${i}" loop playsinline onclick="this.paused?this.play():this.pause()" src="${m.video}"></video><div class="progress" id="p-${i}"></div><div class="right"><button class="btn">❤️</button><div style="font-size:11px;font-weight:800">${m.likes}</div><button class="btn">↗️</button><button class="btn">💬</button></div><div class="info"><div class="user">${m.user}</div><div class="title">${m.title}</div><div class="desc">${m.desc}</div></div></div>`;
});
document.getElementById("feed").innerHTML=h;
observe();
play(0);
}
function observe(){
let ob=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){play(parseInt(e.target.id.split("-")[1]))}});},{threshold:0.7});
document.querySelectorAll(".card").forEach(c=>ob.observe(c));
}
function play(idx){
document.querySelectorAll("video").forEach(v=>v.pause());
let v=document.getElementById("v-"+idx);
if(v){v.play().catch(()=>{});v.ontimeupdate=()=>{document.getElementById("p-"+idx).style.width=(v.currentTime/v.duration*100)+"%";}}
}
render();
</script>
</body>
</html>
