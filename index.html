<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WatchWell</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}body{background:#000;color:#fff;height:100vh;overflow:hidden}:root{--pink:#fe2c55;--gray:#8a8b91}.header{position:fixed;top:0;left:0;right:0;height:56px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;border-bottom:1px solid #222}.logo{display:flex;align-items:center;gap:8px}.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#ff7a18,#fe2c55);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}.logo-text{font-weight:800;font-size:22px}.user-pill{display:flex;align-items:center;gap:10px}.username-pill{background:#222;border-radius:20px;padding:6px 14px;font-size:13px;color:#ddd}.logout-btn{background:var(--pink);border:none;color:#fff;padding:7px 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}.page{display:none;height:calc(100vh - 106px);margin-top:56px;overflow-y:auto}.page.active{display:block}#homePage{background:#000;overflow:hidden}.feed-container{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}.feed-item{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#111}.feed-item video{width:100%;height:100%;object-fit:cover}.feed-overlay{position:absolute;bottom:0;left:0;right:70px;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.8))}.feed-user{font-weight:700;font-size:15px;margin-bottom:4px}.feed-desc{font-size:13px;color:#eee}.feed-actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:22px;align-items:center}.action-btn{display:flex;flex-direction:column;align-items:center;gap:4px}.action-icon{width:46px;height:46px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}.action-count{font-size:12px;font-weight:600}#explorePage{padding:2px}.explore-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}.explore-item{aspect-ratio:9/12;background:#111;position:relative;overflow:hidden}.explore-item video{width:100%;height:100%;object-fit:cover}.explore-views{position:absolute;bottom:4px;left:4px;font-size:11px;background:rgba(0,0,0,0.5);padding:2px 5px;border-radius:3px}#inboxPage.active{display:flex;align-items:center;justify-content:center;flex-direction:column}#mePage{background:#000;padding-bottom:20px}.profile-top{display:flex;flex-direction:column;align-items:center;padding:18px 0 10px}.avatar{width:96px;height:96px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:40px;color:#666;margin-bottom:12px}.profile-name{font-size:19px;font-weight:700;color:#555;margin-bottom:2px}.profile-handle{font-size:14px;color:#777;margin-bottom:14px}.stats{display:flex;justify-content:center;width:100%;max-width:320px;margin:0 auto 14px}.stat{flex:1;text-align:center;border-right:1px solid #222}.stat:last-child{border:none}.stat-num{font-size:18px;font-weight:800}.stat-label{font-size:13px;color:var(--gray);margin-top:2px}.profile-actions{display:flex;gap:10px;justify-content:center;margin-bottom:18px}.pill-btn{background:#222;border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}.pill-btn i{color:var(--pink)}.profile-tabs{display:flex;border-top:1px solid #222;border-bottom:1px solid #111}.tab{flex:1;padding:12px 0;text-align:center;color:#555;font-size:20px;cursor:pointer}.tab.active{color:#fff;border-bottom:2px solid #fff}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}.empty-title{font-size:20px;font-weight:800;margin-bottom:14px}.signup-btn{background:var(--pink);border:none;color:#fff;padding:12px 36px;border-radius:24px;font-weight:700;font-size:16px;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:50px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:200}.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gray);cursor:pointer;font-size:10px;font-weight:600;flex:1}.nav-item.active{color:#fff}.nav-item i{font-size:20px}.plus-btn{width:44px;height:28px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid #000}.plus-btn::before{content:'';position:absolute;left:-4px;top:2px;bottom:2px;width:50%;background:#25f4ee;border-radius:8px 0 0 8px;z-index:-1}.plus-btn::after{content:'';position:absolute;right:-4px;top:2px;bottom:2px;width:50%;background:var(--pink);border-radius:0 8px 8px 0;z-index:-1}.plus-btn i{color:#000;font-size:16px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:500;align-items:center;justify-content:center;padding:20px}.modal.active{display:flex}.modal-box{background:#1a1a1a;width:100%;max-width:360px;border-radius:16px;padding:20px}.modal-title{font-size:18px;font-weight:800;margin-bottom:14px}.modal input,.modal textarea{width:100%;background:#222;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;margin-bottom:12px;font-size:14px}.modal-actions{display:flex;gap:10px}.btn-cancel{flex:1;background:#222;border:none;color:#fff;padding:10px;border-radius:20px;font-weight:700;cursor:pointer}.btn-post{flex:1;background:var(--pink);border:none;color:#fff;padding:10px;border-radius:20px;font-weight:700;cursor:pointer}</style></head><body>
