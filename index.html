<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WatchWell - Real Only</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#07070a;color:#fff;min-height:100vh}.wall{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#07070a,#151525);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.wall.hide{display:none}.wall h1{font-size:42px;font-weight:900;line-height:.9}.wall h1 span{background:linear-gradient(135deg,#ff3b6e,#ffb02e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.box{width:100%;max-width:380px;background:#101017;border:1px solid #1e1e2a;border-radius:20px;padding:20px;margin-top:20px}.inp{width:100%;padding:12px;background:#07070a;border:1px solid #222;border-radius:10px;color:#fff;margin-bottom:8px;outline:none}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.btn-p{background:linear-gradient(135deg,#ff3b6e,#ffb02e);color:#fff}.tabs{display:flex;background:#07070a;padding:4px;border-radius:10px;margin-bottom:12px}.tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;color:#666;font-weight:700}.tab.on{background:#fff;color:#000}.app{display:none;min-height:100vh}.app.on{display:block}.top{position:fixed;top:0;left:0;right:0;height:56px;background:#07070a;border-bottom:1px solid #1a1a22;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}.logo{font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center}.logo b{width:32px;height:32px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border-radius:9px;display:flex;align-items:center;justify-content:center}.main{padding:70px 0 80px;max-width:600px;margin:0 auto}.card{background:#101017;border:1px solid #1c1c26;border-radius:18px;margin:10px;overflow:hidden}.ch{padding:10px 12px;display:flex;gap:10px;align-items:center}.av{width:38px;height:38px;border-radius:50%}.cv{background:#000;aspect-ratio:9/11;max-height:560px}.cv video,.cv img{width:100%;height:100%;object-fit:cover}.actions{padding:10px 12px;display:flex;justify-content:space-between}.a{padding:7px 12px;background:#181822;border:1px solid #222;border-radius:20px;font-size:12px;cursor:pointer}.a.on{background:#ff3b6e;color:#fff;border-color:#ff3b6e}.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#07070a;border-top:1px solid #1a1a22;display:flex;justify-content:space-around;align-items:center;z-index:20}.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#555;font-size:10px;font-weight:700;cursor:pointer}.ni.on{color:#fff}.chat{position:fixed;inset:0;background:#07070a;z-index:50;display:none;flex-direction:column}.chat.on{display:flex}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:800;z-index:99;display:none}.toast.on{display:block}</style></head><body>
<div class="wall" id="wall"><div style="width:60px;height:60px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;margin-bottom:16px">W</div><h1>Watch.<br>Shop.<br><span>Meet.</span></h1><p style="color:#888;font-size:15px;margin:14px 0;max-width:320px">No fake posts. Real people only. Sign up to see & post!</p><div class="box"><div class="tabs"><div class="tab on" id="tL" onclick="setTab('login')">Login</div><div class="tab" id="tR" onclick="setTab('register')">Sign Up</div></div><input id="eIn" class="inp" placeholder="Email"><input id="pIn" type="password" class="inp" placeholder="Password"><input id="nIn" class="inp" placeholder="Your Name / Shop Name" style="display:none"><button id="aBtn" class="btn btn-p" onclick="doAuth()">Login</button><div id="msg" style="font-size:12px;text-align:center;margin-top:8px;display:none"></div></div></div>
<div class="app" id="app"><div class="top"><div class="logo"><b>W</b>WatchWell</div><div style="display:flex;gap:6px"><span id="uName" style="padding:7px 12px;background:#15151f;border-radius:20px;font-size:12px">User</span><button onclick="logout()" style="padding:7px 12px;background:#1a1a22;border:1px solid #222;border-radius:20px;color:#fff;font-size:12px;cursor:pointer">Logout</button></div></div><div class="main" id="feed"></div><div class="nav"><div class="ni on"><i>🏠</i>Home</div><div class="ni" onclick="openPost()"><i>➕</i>Post</div><div class="ni" onclick="openInbox()"><i>💬</i>Inbox</div><div class="ni" onclick="openMe()"><i>👤</i>Me</div></div></div>
<div class="chat" id="chatM"><div style="height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #1c1c26"><span onclick="closeChat()" style="cursor:pointer;background:#15151f;padding:6px 10px;border-radius:50%">←</span><img id="cImg" style="width:36px;height:36px;border-radius:50%"><b id="cName">Name</b></div><div id="cBody" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div><div style="display:flex;gap:8px;padding:10px;border-top:1px solid #1c1c26"><input id="cIn" placeholder="Message..." style="flex:1;padding:11px 14px;background:#101017;border:1px solid #222;border-radius:20px;color:#fff;outline:none" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()" style="padding:10px 16px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border:none;border-radius:20px;color:#fff;font-weight:800;cursor:pointer">Send</button></div></div>
<div id="postM" style="position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px"><div class="box"><div style="display:flex;justify-content:space-between"><h3>New Post</h3><span onclick="closePost()" style="cursor:pointer;background:#222;padding:5px 10px;border-radius:50%">✕</span></div><div onclick="document.getElementById('fIn').click()" style="border:2px dashed #333;border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin:12px 0"><div id="upTxt">📤 Tap to add photo/video</div><input type="file" id="fIn" accept="image/*,video/*" style="display:none"><img id="pImg" style="width:100%;border-radius:10px;margin-top:10px;display:none;max-height:200px;object-fit:cover"><video id="pVid" style="width:100%;border-radius:10px;margin-top:10px;display:none;max-height:200px" controls></video></div><input id="tIn" class="inp" placeholder="Title"><input id="dIn" class="inp" placeholder="Description"><button class="btn btn-p" onclick="publish()">Post Now 🚀</button></div></div>
<div class="toast" id="toast"></div>
<script>
let tab='login',me=JSON.parse(localStorage.getItem('ww_real_me')||'null'),posts=JSON.parse(localStorage.getItem('ww_real_posts')||'[]'),likes=new Set(JSON.parse(localStorage.getItem('ww_real_likes')||'[]')),curChat=null,chats=JSON.parse(localStorage.getItem('ww_real_chats')||'{}'),media=null,isVid=false;
function save(){localStorage.setItem('ww_real_me',JSON.stringify(me));localStorage.setItem('ww_real_posts',JSON.stringify(posts));localStorage.setItem('ww_real_likes',JSON.stringify([...likes]));localStorage.setItem('ww_real_chats',JSON.stringify(chats))}
function init(){if(me){document.getElementById('wall').classList.add('hide');document.getElementById('app').classList.add('on');document.getElementById('uName').innerText=me.name;render();}else{document.getElementById('wall').classList.remove('hide');document.getElementById('app').classList.remove('on');}}
function setTab(t){tab=t;document.getElementById('tL').classList.toggle('on',t==='login');document.getElementById('tR').classList.toggle('on',t==='register');document.getElementById('nIn').style.display=t==='register'?'block':'none';document.getElementById('aBtn').innerText=t==='register'?'Sign Up':'Login'}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function doAuth(){let e=document.getElementById('eIn').value.trim();let p=document.getElementById('pIn').value.trim();let n=document.getElementById('nIn').value.trim()||e.split('@')[0]||'User';let m=document.getElementById('msg');if(!e||!p){m.style.display='block';m.style.color='#ff6b6b';m.innerText='Enter email & password';return}if(p.length<4){m.style.display='block';m.style.color='#ff6b6b';m.innerText='Password min 4';return}let all=JSON.parse(localStorage.getItem('ww_real_all')||'[]');if(tab==='register'){if(all.find(a=>a.email===e)){m.style.display='block';m.style.color='#ff6b6b';m.innerText='Email exists, login';setTab('login');return}me={email:e,name:n,pass:p,id:Date.now().toString()};all.push(me);localStorage.setItem('ww_real_all',JSON.stringify(all));}else{let found=all.find(a=>a.email===e&&a.pass===p);if(!found){m.style.display='block';m.style.color='#ff6b6b';m.innerText='Wrong! Sign up first';return}me=found;}save();init();toast('Welcome '+me.name+'!')}
function logout(){if(confirm('Logout?')){me=null;localStorage.removeItem('ww_real_me');init()}}
function render(){let feed=document.getElementById('feed');if(!posts.length){feed.innerHTML=`<div style="text-align:center;padding:80px 20px"><div style="font-size:60px">👋</div><h3 style="margin:12px 0">Welcome ${me.name}!</h3><p style="color:#888;font-size:14px">No posts yet - you are first!<br>Tap Post to create first real post!</p><button class="btn btn-p" style="max-width:200px;margin:20px auto" onclick="openPost()">+ Create First Post</button><p style="font-size:11px;color:#555;margin-top:20px">Fake posts deleted! Only real users.</p></div>`;return;}feed.innerHTML=posts.map(p=>`<div class="card"><div class="ch"><img class="av" src="${p.av}"><div style="flex:1"><div style="font-weight:700;font-size:13px">${p.title}</div><div style="font-size:11px;color:#777">@${p.user}</div></div></div><div class="cv">${p.isVideo?`<video src="${p.media}" loop playsinline controls></video>`:`<img src="${p.media}">`}</div><div class="actions"><div style="display:flex;gap:8px"><div class="a ${likes.has(p.id)?'on':''}" onclick="like('${p.id}',this)">${likes.has(p.id)?'❤️':'🤍'} <span>${p.likes}</span></div><div class="a" onclick="openChat('${p.user}')">💬 Message</div></div><div class="a" onclick="sharePost('${p.id}')">↗️ Share</div></div><div style="padding:0 12px 12px;font-size:13px"><b>${p.user}</b> ${p.desc}</div></div>`).join('');}
function openPost(){document.getElementById('postM').style.display='flex'}function closePost(){document.getElementById('postM').style.display='none'}
document.getElementById('fIn').addEventListener('change',function(){let f=this.files[0];if(!f)return;isVid=f.type.startsWith('video');let url=URL.createObjectURL(f);media=url;document.getElementById('upTxt').innerText=f.name;if(isVid){let v=document.getElementById('pVid');v.src=url;v.style.display='block';document.getElementById('pImg').style.display='none'}else{let i=document.getElementById('pImg');i.src=url;i.style.display='block';document.getElementById('pVid').style.display='none'}})
function publish(){let title=document.getElementById('tIn').value||'My Post';let desc=document.getElementById('dIn').value||'#watchwell';if(!media){toast('Add photo/video!');return}let np={id:Date.now().toString(),title,desc,user:me.name,av:'https://i.pravatar.cc/150?u='+me.email,media,isVideo:isVid,likes:0};posts.unshift(np);save();closePost();render();toast('Posted! Real user only ✅')}
function like(id,el){let p=posts.find(x=>x.id===id);if(likes.has(id)){likes.delete(id);p.likes--;el.classList.remove('on');el.innerHTML=`🤍 <span>${p.likes}</span>`}else{likes.add(id);p.likes++;el.classList.add('on');el.innerHTML=`❤️ <span>${p.likes}</span>`}save()}
function sharePost(id){let url='https://watchwellofficial.github.io/watchwell/?p='+id;navigator.clipboard.writeText(url).then(()=>toast('Link copied!'))}
function openChat(user){curChat=user;document.getElementById('chatM').classList.add('on');document.getElementById('cName').innerText=user;document.getElementById('cImg').src=posts.find(p=>p.user===user)?.av||'https://i.pravatar.cc/150?u='+user;let key=me.email+'_'+user;let h=chats[key]||[];document.getElementById('cBody').innerHTML=(h.length?h:[{me:false,text:`Hi ${me.name}!`}]).map(m=>`<div style="max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;${m.me?'align-self:flex-end;background:linear-gradient(135deg,#ff3b6e,#ffb02e)':'align-self:flex-start;background:#101017;border:1px solid #1c1c26'}">${m.text}</div>`).join('');}
function closeChat(){document.getElementById('chatM').classList.remove('on')}
function sendMsg(){let inp=document.getElementById('cIn');let t=inp.value.trim();if(!t||!curChat)return;let key=me.email+'_'+curChat;if(!chats[key])chats[key]=[];chats[key].push({me:true,text:t});save();document.getElementById('cBody').insertAdjacentHTML('beforeend',`<div style="max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;align-self:flex-end;background:linear-gradient(135deg,#ff3b6e,#ffb02e)">${t}</div>`);inp.value='';}
function openInbox(){let main=document.getElementById('feed');let keys=Object.keys(chats);if(!keys.length){main.innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:50px">💬</div><h3>No messages</h3></div>`;return}main.innerHTML=keys.map(k=>{let other=k.replace(me.email+'_','');return `<div class="card" style="cursor:pointer" onclick="openChat('${other}')"><div class="ch"><img class="av" src="https://i.pravatar.cc/150?u=${other}"><div style="flex:1"><b>${other}</b></div></div></div>`}).join('')}
function openMe(){document.getElementById('feed').innerHTML=`<div style="padding:16px"><div style="background:#101017;border:1px solid #1c1c26;border-radius:16px;padding:20px;text-align:center"><img src="https://i.pravatar.cc/150?u=${me.email}" style="width:80px;height:80px;border-radius:50%"><h3 style="margin-top:10px">${me.name}</h3><p style="color:#777;font-size:12px">${me.email}</p><button onclick="if(confirm('Delete ALL posts?')){posts=[];save();render();toast('Deleted! Fresh start')}" style="width:100%;margin-top:12px;padding:10px;background:#ff3b6e22;border:1px solid #ff3b6e44;color:#ff3b6e;border-radius:10px;cursor:pointer">🗑️ Delete All Posts</button><button onclick="logout()" style="width:100%;margin-top:8px;padding:10px;background:#15151f;border:1px solid #222;border-radius:10px;color:#fff;cursor:pointer">Logout</button></div></div>`}
init();
</script>
</body>
</html>
