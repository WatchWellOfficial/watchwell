<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>WatchWell - TikTok Style</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw}.top-tabs{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:18px;padding:14px 20px 10px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);font-size:15px;font-weight:600;color:#aaa}.top-tabs span{cursor:pointer;padding-bottom:4px;border-bottom:2px solid transparent}.top-tabs span.active{color:#fff;border-color:#fff}.top-tabs .search{position:absolute;right:14px;top:12px}.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}.feed::-webkit-scrollbar{display:none}.video-slide{height:100vh;width:100vw;position:relative;scroll-snap-align:start;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.video-slide video,.video-slide img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.2) 0%,transparent 30%,transparent 60%,rgba(0,0,0,0.7) 100%)}.actions{position:absolute;right:10px;bottom:100px;z-index:10;display:flex;flex-direction:column;gap:18px;align-items:center}.action-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.action-icon{width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(10px)}.action-icon.liked{background:#ff2d55}.action-count{font-size:12px;font-weight:600}.profile-ring{width:48px;height:48px;border-radius:50%;border:2px solid #fff;position:relative}.profile-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}.plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#ff2d55;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}.info{position:absolute;left:12px;bottom:90px;z-index:10;max-width:70%}.shop{font-weight:700;font-size:15px;margin-bottom:4px}.handle{font-size:14px;color:#ddd}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0 8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#888;font-size:10px;font-weight:600}.nav-item.active{color:#fff}.nav-icon{font-size:22px}.nav-plus{width:42px;height:28px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}.nav-plus::before{content:'';position:absolute;left:-3px;top:2px;width:100%;height:100%;background:#ff2d55;border-radius:8px;z-index:-1}.nav-plus::after{content:'';position:absolute;right:-3px;top:2px;width:100%;height:100%;background:#00f2ea;border-radius:8px;z-index:-1}.nav-plus span{color:#000;font-size:20px;font-weight:800}#authModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:flex-end}#authModal.show{display:flex}.auth-sheet{width:100%;background:#16161f;border-radius:20px 20px 0 0;padding:24px;max-height:85vh;overflow:auto}.auth-sheet h2{font-size:22px;margin-bottom:6px;text-align:center}.auth-sheet p{color:#888;text-align:center;margin-bottom:20px;font-size:13px}.auth-sheet .tabs{display:flex;gap:8px;margin-bottom:18px;background:#0f0f15;padding:4px;border-radius:10px}.auth-sheet .tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;color:#888;font-weight:600}.auth-sheet .tab.active{background:#fff;color:#000}.auth-sheet input{width:100%;padding:14px 16px;background:#0f0f15;border:1px solid #222;border-radius:10px;color:#fff;margin-bottom:12px;outline:none}.auth-sheet button.main{width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:13px;text-align:center;display:none}.msg.error{background:#2a1215;color:#ff6b6b;display:block}.msg.success{background:#122a18;color:#4ade80;display:block}.close-bar{width:40px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}</style></head><body>
<div class="top-tabs"><span>Drama</span><span>Following</span><span>Friends</span><span class="active">For You</span><div class="search">🔍</div></div>
<div class="feed" id="feed"></div>
<div class="bottom-nav"><div class="nav-item active" onclick="goHome()"><div class="nav-icon">🏠</div>Home</div><div class="nav-item"><div class="nav-icon">⊞</div>Explore</div><div class="nav-item" onclick="showAuth()"><div class="nav-plus"><span>+</span></div></div><div class="nav-item" onclick="showAuth()"><div class="nav-icon">💬</div>Inbox</div><div class="nav-item" onclick="showAuth()" id="meTab"><div class="nav-icon">👤</div>Me</div></div>
<div id="authModal"><div class="auth-sheet"><div class="close-bar" onclick="hideAuth()"></div><h2>Welcome to WatchWell</h2><p>Login to like, comment & upload</p><div class="tabs"><div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div><div class="tab" id="tab-register" onclick="switchTab('register')">Register</div></div><input type="email" id="email" placeholder="Email address"><input type="password" id="password" placeholder="Password"><input type="text" id="displayName" placeholder="Display name" style="display:none"><button class="main" id="submitBtn" onclick="handleAuth()">Login</button><div class="msg" id="msg"></div><div style="text-align:center;margin-top:14px;color:#666;font-size:12px" id="userStatus"></div><button onclick="logout()" id="logoutBtn" style="display:none;margin-top:12px;width:100%;padding:10px;background:#222;border:none;border-radius:10px;color:#fff">Logout</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyD3fLCeLfBYThUFIAbAIp8jSyEpkhV5Uak",authDomain:"watchwell-73338.firebaseapp.com",projectId:"watchwell-73338",storageBucket:"watchwell-73338.firebasestorage.app",messagingSenderId:"1033589914261",appId:"1:1033589914261:web:55c859b3d6f24c8029799c"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);let currentTab='login';
window.switchTab=(t)=>{currentTab=t;document.getElementById('tab-login').classList.toggle('active',t==='login');document.getElementById('tab-register').classList.toggle('active',t==='register');document.getElementById('displayName').style.display=t==='register'?'block':'none';document.getElementById('submitBtn').innerText=t==='register'?'Create Account':'Login';};
const videos=[{shop:"Chrismos shop 🧑‍🔧",handle:"@Chrismos Meca 🔧 #motorcycle #mechanic",likes:"1.1K",comments:"23",saves:"140",shares:"24",img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},{shop:"WatchWell Movies 🎬",handle:"@watchwell_official #avengers #marvel #fyp",likes:"4.2K",comments:"89",saves:"512",shares:"102",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"},{shop:"Auto Fix 🔧",handle:"@autofix_garage #engine #repair See more",likes:"892",comments:"12",saves:"67",shares:"18",img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"},{shop:"Bike Lovers 🏍️",handle:"@bikelovers #yamaha #mechanic life",likes:"2.3K",comments:"45",saves:"210",shares:"56",img:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"}];
function renderFeed(){const feed=document.getElementById('feed');feed.innerHTML=videos.map((v,i)=>`<div class="video-slide"><video src="${v.video}" loop muted playsinline poster="${v.img}" id="vid${i}"></video><div class="overlay"></div><div class="actions"><div class="action-btn"><div class="profile-ring"><img src="${v.img}"><div class="plus">+</div></div></div><div class="action-btn" onclick="handleLike(this)"><div class="action-icon">🤍</div><span class="action-count">${v.likes}</span></div><div class="action-btn" onclick="showAuth()"><div class="action-icon">💬</div><span class="action-count">${v.comments}</span></div><div class="action-btn" onclick="showAuth()"><div class="action-icon">🔖</div><span class="action-count">${v.saves}</span></div><div class="action-btn" onclick="showAuth()"><div class="action-icon">↗️</div><span class="action-count">${v.shares}</span></div><div class="action-btn" onclick="shareWhatsApp()"><div class="action-icon" style="background:#25D366">💚</div></div><div class="action-btn"><div class="profile-ring" style="width:36px;height:36px"><img src="${v.img}"></div></div></div><div class="info"><div class="shop">${v.shop}</div><div class="handle">${v.handle}</div></div></div>`).join('');const first=document.getElementById('vid0');if(first){first.play();}const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{const vd=e.target.querySelector('video');if(!vd)return;if(e.isIntersecting){vd.play().catch(()=>{});}else{vd.pause();}});},{threshold:0.7});document.querySelectorAll('.video-slide').forEach(s=>obs.observe(s));}renderFeed();
window.handleLike=(el)=>{if(!auth.currentUser){showAuth();return;}const icon=el.querySelector('.action-icon');icon.classList.toggle('liked');icon.innerText=icon.classList.contains('liked')?'❤️':'🤍';};
window.showAuth=()=>{document.getElementById('authModal').classList.add('show');};window.hideAuth=()=>{document.getElementById('authModal').classList.remove('show');};window.goHome=()=>{document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});};window.shareWhatsApp=()=>{window.open('https://wa.me/?text=Check%20WatchWell%20https://hwellofficial.github.io','_blank');};
function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;el.style.display=t?'block':'none';}
window.handleAuth=async()=>{const email=document.getElementById('email').value.trim();const pass=document.getElementById('password').value;const name=document.getElementById('displayName').value.trim();const btn=document.getElementById('submitBtn');if(!email||!pass){showMsg('Enter email & password','error');return;}btn.disabled=true;btn.innerText='Please wait...';try{if(currentTab==='register'){const c=await createUserWithEmailAndPassword(auth,email,pass);if(name)await updateProfile(c.user,{displayName:name});showMsg('✅ Account created!','success');}else{await signInWithEmailAndPassword(auth,email,pass);showMsg('✅ Login successful!','success');}setTimeout(()=>{hideAuth();},1000);}catch(err){showMsg(err.code==='auth/email-already-in-use'?'Email already exists, please login':err.message,'error');}btn.disabled=false;btn.innerText=currentTab==='register'?'Create Account':'Login';};
window.logout=async()=>{await signOut(auth);hideAuth();};
onAuthStateChanged(auth,(u)=>{const status=document.getElementById('userStatus');const logoutBtn=document.getElementById('logoutBtn');const meTab=document.getElementById('meTab');if(u){status.innerText='Logged in as '+(u.displayName||u.email);logoutBtn.style.display='block';meTab.innerHTML='<div class="nav-icon">👤</div>'+(u.displayName||'Me').substring(0,6);}else{status.innerText='Not logged in - videos play without login';logoutBtn.style.display='none';meTab.innerHTML='<div class="nav-icon">👤</div>Me';}});
document.getElementById('authModal').addEventListener('click',(e)=>{if(e.target.id==='authModal')hideAuth();});
</script></body></html>
