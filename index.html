<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WatchWell - Real Only</title>
<script>
// FORCE DELETE ALL OLD DATA
Object.keys(localStorage).forEach(k=>{if(k.startsWith('ww_')||k.startsWith('watchwell')) localStorage.removeItem(k);});
</script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#07070a;color:#fff;min-height:100vh}
.wall{position:fixed;inset:0;z-index:9999;background:#07070a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.wall.hide{display:none!important}
.box{width:100%;max-width:360px;background:#101017;border:1px solid #1e1e2a;border-radius:20px;padding:20px;margin-top:20px}
.inp{width:100%;padding:12px;background:#07070a;border:1px solid #222;border-radius:10px;color:#fff;margin-bottom:8px;outline:none}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.btn-p{background:linear-gradient(135deg,#ff3b6e,#ffb02e);color:#fff}
.tabs{display:flex;background:#07070a;padding:4px;border-radius:10px;margin-bottom:12px}.tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;color:#666;font-weight:700}.tab.on{background:#fff;color:#000}
.app{display:none;min-height:100vh}.app.on{display:block!important}
.top{position:fixed;top:0;left:0;right:0;height:56px;background:#07070a;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.main{padding:70px 0 80px;max-width:600px;margin:0 auto}.card{background:#101017;border:1px solid #222;border-radius:18px;margin:10px;overflow:hidden}.ch{padding:10px 12px;display:flex;gap:10px;align-items:center}.av{width:38px;height:38px;border-radius:50%;object-fit:cover}.cv{background:#000}.cv img,.cv video{width:100%;max-height:500px;object-fit:contain;display:block}
.actions{padding:10px 12px;display:flex;gap:8px}.a{padding:7px 12px;background:#181822;border:1px solid #222;border-radius:20px;font-size:12px;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#07070a;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;color:#666;font-size:10px;font-weight:700;cursor:pointer}.ni.on{color:#fff}
.chat{position:fixed;inset:0;background:#07070a;z-index:50;display:none;flex-direction:column}.chat.on{display:flex}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:800;z-index:99999;display:none}.toast.on{display:block}
</style></head><body>

<div class="wall" id="wall">
<div style="width:64px;height:64px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px">W</div>
<h1 style="margin-top:16px;font-size:40px;font-weight:900;line-height:.9">Watch.<br>Shop.<br><span style="background:linear-gradient(135deg,#ff3b6e,#ffb02e);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Meet.</span></h1>
<p style="color:#888;font-size:14px;margin:14px 0;max-width:300px">No fake posts. Real people only. Sign up to see & post!</p>
<div class="box">
<div class="tabs"><div class="tab on" id="tL" onclick="setTab('login')">Login</div><div class="tab" id="tR" onclick="setTab('register')">Sign Up</div></div>
<input id="eIn" class="inp" placeholder="Email">
<input id="pIn" type="password" class="inp" placeholder="Password (min 4)">
<input id="nIn" class="inp" placeholder="Your Name / Shop Name" style="display:none">
<button id="aBtn" class="btn btn-p" onclick="doAuth()">Login</button>
<div id="msg" style="font-size:12px;text-align:center;margin-top:8px;display:none;color:#ff6b6b"></div>
</div>
</div>

<div class="app" id="app">
<div class="top"><div style="font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center"><b style="width:32px;height:32px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border-radius:9px;display:flex;align-items:center;justify-content:center">W</b>WatchWell</div><div style="display:flex;gap:6px"><span id="uName" style="padding:7px 12px;background:#15151f;border-radius:20px;font-size:12px">User</span><button onclick="logout()" style="padding:7px 12px;background:#ff3b6e;border:none;border-radius:20px;color:#fff;font-size:12px;font-weight:800;cursor:pointer">Logout</button></div></div>
<div class="main" id="feed"></div>
<div class="nav"><div class="ni on">🏠<br>Home</div><div class="ni" onclick="openPost()">➕<br>Post</div><div class="ni" onclick="openInbox()">💬<br>Inbox</div><div class="ni" onclick="openMe()">👤<br>Me</div></div>
</div>

<div class="chat" id="chatM"><div style="height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #222"><span onclick="closeChat()" style="cursor:pointer;background:#15151f;padding:6px 10px;border-radius:50%">←</span><img id="cImg" style="width:36px;height:36px;border-radius:50%"><b id="cName">Name</b></div><div id="cBody" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div><div style="display:flex;gap:8px;padding:10px;border-top:1px solid #222"><input id="cIn" placeholder="Message..." style="flex:1;padding:11px 14px;background:#101017;border:1px solid #222;border-radius:20px;color:#fff;outline:none" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()" style="padding:10px 16px;background:linear-gradient(135deg,#ff3b6e,#ffb02e);border:none;border-radius:20px;color:#fff;font-weight:800;cursor:pointer">Send</button></div></div>

<div id="postM" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:none;align-items:center;justify-content:center;padding:16px"><div class="box"><div style="display:flex;justify-content:space-between"><h3>New Post</h3><span onclick="closePost()" style="cursor:pointer;background:#222;padding:5px 10px;border-radius:50%">✕</span></div><div onclick="document.getElementById('fIn').click()" style="border:2px dashed #333;border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin:12px 0"><div id="upTxt">📤 Tap to add photo/video</div><input type="file" id="fIn" accept="image/*,video/*" style="display:none"><img id="pImg" style="width:100%;border-radius:10px;margin-top:10px;display:none;max-height:200px;object-fit:cover"><video id="pVid" style="width:100%;border-radius:10px;margin-top:10px;display:none;max-height:200px" controls></video></div><input id="tIn" class="inp" placeholder="Title"><input id="dIn" class="inp" placeholder="Description"><button class="btn btn-p" onclick="publish()">Post Now 🚀</button></div></div>

<div class="toast" id="toast"></div>

<script>
let tab='login',me=null,posts=[],chats={},curChat=null,media=null,isVid=false;
try{me=JSON.parse(localStorage.getItem('final_me')||'null');posts=JSON.parse(localStorage.getItem('final_posts')||'[]');chats=JSON.parse(localStorage.getItem('final_chats')||'{}');}catch(e){me=null;posts=[];chats={};}
function save(){localStorage.setItem('final_me',JSON.stringify(me));localStorage.setItem('final_posts',JSON.stringify(posts));localStorage.setItem('final_chats',JSON.stringify(chats));}
function init(){
if(me){
document.getElementById('wall').classList.add('hide');
document.getElementById('app').classList.add('on');
document.getElementById('uName').innerText=me.name;
render();
}else{
document.getElementById('wall').classList.remove('hide');
document.getElementById('app').classList.remove('on');
document.getElementById('feed').innerHTML='';
}
}
function setTab(t){tab=t;document.getElementById('tL').classList.toggle('on',t==='login');document.getElementById('tR').classList.toggle('on',t==='register');document.getElementById('nIn').style.display=t==='register'?'block':'none';document.getElementById('aBtn').innerText=t==='register'?'Sign Up':'Login'}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function doAuth(){
let e=document.getElementById('eIn').value.trim(),p=document.getElementById('pIn').value.trim(),n=document.getElementById('nIn').value.trim()||e.split('@')[0]||'User',m=document.getElementById('msg');
if(!e||!p){m.style.display='block';m.innerText='Enter email & password';return}
if(p.length<4){m.style.display='block';m.innerText='Password min 4';return}
let all=JSON.parse(localStorage.getItem('final_all')||'[]');
if(tab==='register'){
if(all.find(a=>a.email===e)){m.style.display='block';m.innerText='Email exists, login now';setTab('login');return}
me={email:e,name:n,pass:p};all.push(me);localStorage.setItem('final_all',JSON.stringify(all));
}else{
let f=all.find(a=>a.email===e&&a.pass===p);if(!f){m.style.display='block';m.innerText='Wrong! Sign up first';return}me=f;
}
save();init();toast('Welcome '+me.name+'!');
}
function logout(){
if(confirm('Logout? This will hide all posts until you login again (deletes that engine video from view)!')){
me=null;localStorage.removeItem('final_me');init();toast('Logged out - no posts visible! ✅');location.reload();
}
}
function render(){
let feed=document.getElementById('feed');
if(!posts.length){
feed.innerHTML=`<div style="text-align:center;padding:80px 20px"><div style="font-size:60px">👋</div><h3 style="margin:12px 0">Welcome ${me.name}!</h3><p style="color:#888;font-size:14px">No posts yet - you are FIRST!<br>Only real users who sign up can post.</p><button class="btn btn-p" style="max-width:220px;margin:20px auto" onclick="openPost()">+ Create First Real Post</button></div>`;
return;
}
feed.innerHTML=posts.map(p=>`<div class="card"><div class="ch"><img class="av" src="${p.av}"><div style="flex:1"><div style="font-weight:700;font-size:13px">${p.title}</div><div style="font-size:11px;color:#777">@${p.user}</div></div></div><div class="cv">${p.isVideo?`<video src="${p.media}" controls loop playsinline></video>`:`<img src="${p.media}">`}</div><div class="actions"><div class="a" onclick="openChat('${p.user}')">💬 Message</div><div class="a" onclick="sharePost()">↗️ Share</div><div class="a" style="margin-left:auto;color:#ff3b6e" onclick="deletePost('${p.id}')">🗑️ Delete</div></div><div style="padding:0 12px 12px;font-size:13px"><b>${p.user}</b> ${p.desc}</div></div>`).join('');
}
function openPost(){document.getElementById('postM').style.display='flex'}function closePost(){document.getElementById('postM').style.display='none'}
document.getElementById('fIn').addEventListener('change',function(){let f=this.files[0];if(!f)return;isVid=f.type.startsWith('video');let url=URL.createObjectURL(f);media=url;document.getElementById('upTxt').innerText=f.name;if(isVid){let v=document.getElementById('pVid');v.src=url;v.style.display='block';document.getElementById('pImg').style.display='none'}else{let i=document.getElementById('pImg');i.src=url;i.style.display='block';document.getElementById('pVid').style.display='none'}})
function publish(){let title=document.getElementById('tIn').value||'My Post',desc=document.getElementById('dIn').value||'#watchwell';if(!media){toast('Add photo/video!');return}let np={id:Date.now().toString(),title,desc,user:me.name,av:'https://i.pravatar.cc/150?u='+me.email,media,isVideo:isVid,likes:0};posts.unshift(np);save();closePost();render();toast('Posted! Real only ✅');document.getElementById('tIn').value='';document.getElementById('dIn').value='';media=null;document.getElementById('pImg').style.display='none';document.getElementById('pVid').style.display='none';document.getElementById('upTxt').innerText='📤 Tap to add photo/video'}
function deletePost(id){if(confirm('Delete this post?')){posts=posts.filter(p=>p.id!==id);save();render();toast('Deleted!')}}
function sharePost(){navigator.clipboard.writeText(location.href).then(()=>toast('Link copied!'))}
function openChat(user){curChat=user;document.getElementById('chatM').classList.add('on');document.getElementById('cName').innerText=user;document.getElementById('cImg').src='https://i.pravatar.cc/150?u='+user;let key=me.email+'_'+user;let h=chats[key]||[];document.getElementById('cBody').innerHTML=(h.length?h:[{me:false,text:`Hi ${me.name}!`}]).map(m=>`<div style="max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;${m.me?'align-self:flex-end;background:linear-gradient(135deg,#ff3b6e,#ffb02e)':'align-self:flex-start;background:#101017;border:1px solid #222'}">${m.text}</div>`).join('');}
function closeChat(){document.getElementById('chatM').classList.remove('on')}
function sendMsg(){let inp=document.getElementById('cIn'),t=inp.value.trim();if(!t||!curChat)return;let key=me.email+'_'+curChat;if(!chats[key])chats[key]=[];chats[key].push({me:true,text:t});save();document.getElementById('cBody').insertAdjacentHTML('beforeend',`<div style="max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;align-self:flex-end;background:linear-gradient(135deg,#ff3b6e,#ffb02e)">${t}</div>`);inp.value='';}
function openInbox(){let main=document.getElementById('feed'),keys=Object.keys(chats);if(!keys.length){main.innerHTML=`<div style="text-align:center;padding:60px 20px">💬<br>No messages</div>`;return}main.innerHTML=keys.map(k=>{let o=k.replace(me.email+'_','');return `<div class="card" style="cursor:pointer" onclick="openChat('${o}')"><div class="ch"><img class="av" src="https://i.pravatar.cc/150?u=${o}"><div style="flex:1"><b>${o}</b></div></div></div>`}).join('')}
function openMe(){document.getElementById('feed').innerHTML=`<div style="padding:16px"><div style="background:#101017;border:1px solid #222;border-radius:16px;padding:20px;text-align:center"><img src="https://i.pravatar.cc/150?u=${me.email}" style="width:80px;height:80px;border-radius:50%"><h3 style="margin-top:10px">${me.name}</h3><p style="color:#777">${me.email}</p><p style="margin-top:8px;font-size:13px">Posts: ${posts.length}</p><button onclick="if(confirm('Delete ALL posts? This will delete that engine video!')){posts=[];save();render();toast('All deleted! Fresh start ✅')}" style="width:100%;margin-top:12px;padding:10px;background:#ff3b6e22;border:1px solid #ff3b6e44;color:#ff3b6e;border-radius:10px;cursor:pointer">🗑️ Delete All Posts Forever</button><button onclick="logout()" style="width:100%;margin-top:8px;padding:10px;background:#15151f;border:1px solid #222;border-radius:10px;color:#fff;cursor:pointer">Logout</button></div></div>`}
init();
</script>
</body>
</html>
