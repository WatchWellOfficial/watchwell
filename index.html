<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WatchWell</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0f;color:#fff}.h{position:fixed;top:0;left:0;right:0;height:56px;background:#0a0a0f;border-bottom:1px solid #1e1e2a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10}.logo{font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center}.logo b{width:32px;height:32px;background:linear-gradient(135deg,#4f46e5,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center}.btn{padding:9px 16px;border-radius:20px;border:none;font-weight:700;cursor:pointer}.btn-p{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff}.btn-o{background:#15151f;color:#fff;border:1px solid #222}.main{padding-top:70px;max-width:600px;margin:0 auto;padding-bottom:80px}.card{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;margin:0 12px 16px;overflow:hidden}.ch{padding:12px;display:flex;gap:10px;align-items:center}.av{width:40px;height:40px;border-radius:50%}.cv{background:#000;aspect-ratio:9/12;position:relative}.cv video{width:100%;height:100%;object-fit:cover}.cf{padding:12px;display:flex;justify-content:space-between;align-items:center}.ics{display:flex;gap:14px}.ic{cursor:pointer;padding:6px 10px;border-radius:20px;background:#15151f;font-size:13px;display:flex;gap:5px;align-items:center;user-select:none}.ic:active{transform:scale(.95)}.ic.liked{background:#ef444422;color:#ef4444}.cc{padding:0 12px 12px;font-size:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.box{width:100%;max-width:400px;background:#12121a;border:1px solid #222;border-radius:20px;padding:20px}.inp{width:100%;padding:12px;background:#0a0a0f;border:1px solid #222;border-radius:10px;color:#fff;margin-bottom:8px;outline:none}.tabs{display:flex;background:#0a0a0f;padding:4px;border-radius:10px;margin-bottom:14px}.tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;color:#888;font-weight:700}.tab.on{background:#fff;color:#000}.msg{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;height:70vh;background:#12121a;border:1px solid #222;border-bottom:none;border-radius:20px 20px 0 0;display:none;flex-direction:column;z-index:40}.msg.on{display:flex}.mh{padding:14px;border-bottom:1px solid #1e1e2a;display:flex;justify-content:space-between;font-weight:700}.mb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.bub{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;word-break:break-word}.me{align-self:flex-end;background:linear-gradient(135deg,#4f46e5,#06b6d4)}.them{align-self:flex-start;background:#1e1e2a}.mi{display:flex;gap:8px;padding:10px;border-top:1px solid #1e1e2a}.mi input{flex:1;padding:10px 14px;background:#0a0a0f;border:1px solid #222;border-radius:20px;color:#fff;outline:none}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:99;display:none}.toast.on{display:block}</style></head><body>
<div class="h"><div class="logo"><b>W</b>WatchWell</div><div style="display:flex;gap:8px"><button class="btn btn-o" id="authBtn" onclick="openAuth()">Login</button><button class="btn btn-p" onclick="openUp()">+ Post</button></div></div>
<div class="main" id="feed"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="authM"><div class="box"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><h3 id="aT">Login</h3><span onclick="closeAuth()" style="cursor:pointer;padding:4px 8px;background:#222;border-radius:50%">✕</span></div><div class="tabs"><div class="tab on" id="tL" onclick="setTab('login')">Login</div><div class="tab" id="tR" onclick="setTab('register')">Sign Up</div></div><input id="eIn" class="inp" placeholder="Email (any email works!)"><input id="pIn" type="password" class="inp" placeholder="Password (any!)"><input id="nIn" class="inp" placeholder="Your name" style="display:none"><button class="btn btn-p" style="width:100%;padding:12px;margin-top:4px" id="aBtn" onclick="doAuth()">Login</button><p style="font-size:11px;color:#666;text-align:center;margin-top:10px">Demo mode: Any email/password works! Clickable & working</p></div></div>

<div class="modal" id="upM"><div class="box"><div style="display:flex;justify-content:space-between"><h3>Upload Video</h3><span onclick="closeUp()" style="cursor:pointer;padding:4px 8px;background:#222;border-radius:50%">✕</span></div><div onclick="document.getElementById('fIn').click()" style="border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;margin:12px 0;cursor:pointer" id="drop">📤 Tap to pick video<input type="file" id="fIn" accept="video/*" style="display:none"><video id="pv" style="width:100%;border-radius:10px;margin-top:10px;display:none" controls></video></div><input id="sIn" class="inp" placeholder="Title / Shop name"><input id="dIn" class="inp" placeholder="Description #tag"><button class="btn btn-p" style="width:100%;padding:12px" onclick="publish()">Publish Now</button></div></div>

<div class="msg" id="msgM"><div class="mh"><span id="mName">Messages</span><span onclick="closeMsg()" style="cursor:pointer">✕</span></div><div class="mb" id="mBody"></div><div class="mi"><input id="mIn" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn btn-p" onclick="sendMsg()" style="border-radius:20px;padding:8px 14px">Send</button></div></div>

<script>
let tab='login',user=JSON.parse(localStorage.getItem('ww_user')||'null'),posts=JSON.parse(localStorage.getItem('ww_posts')||'null'),likes=new Set(JSON.parse(localStorage.getItem('ww_likes')||'[]')),curChat=null;
const def=[{id:'1',shop:'Chrismos Auto Care',desc:'Engine rebuild full video 🔧 #motorcycle',likes:1123,user:'Chrismos',av:'https://i.pravatar.cc/150?img=8',video:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},{id:'2',shop:'Bike Engine Hub',desc:'Yamaha sound check 🏍️💨 #bike',likes:2341,user:'BikeHub',av:'https://i.pravatar.cc/150?img=15',video:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'},{id:'3',shop:'Auto Belt Pro',desc:'Fix timing belt 5 mins ⚙️ #tips',likes:892,user:'BeltPro',av:'https://i.pravatar.cc/150?img=20',video:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'}];
if(!posts)posts=def;
function save(){localStorage.setItem('ww_posts',JSON.stringify(posts));localStorage.setItem('ww_likes',JSON.stringify([...likes]))}
function toast(t){const el=document.getElementById('toast');el.innerText=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2000)}
function render(){document.getElementById('feed').innerHTML=posts.map(p=>`<div class="card"><div class="ch"><img class="av" src="${p.av}"><div style="flex:1"><div style="font-weight:700;font-size:14px">${p.shop}</div><div style="font-size:12px;color:#888">@${p.user}</div></div><div onclick="openMsg('${p.user}')" style="cursor:pointer;padding:6px 10px;background:#15151f;border-radius:20px;font-size:12px">✉️ Message</div></div><div class="cv"><video src="${p.video}" loop playsinline onclick="this.paused?this.play():this.pause()" poster="https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=600"></video></div><div class="cf"><div class="ics"><div class="ic ${likes.has(p.id)?'liked':''}" onclick="like('${p.id}',this)">${likes.has(p.id)?'❤️':'🤍'} <span>${p.likes}</span></div><div class="ic" onclick="openMsg('${p.user}')">💬 Comment</div><div class="ic" onclick="sharePost('${p.id}')">↗️ Share</div></div><div class="ic" onclick="openMsg('${p.user}')">✉️</div></div><div class="cc"><b>${p.user}</b> ${p.desc}</div></div>`).join('');const b=document.getElementById('authBtn');if(user){b.innerText=user.name;b.onclick=()=>{if(confirm('Logout '+user.name+'?')){localStorage.removeItem('ww_user');user=null;b.innerText='Login';b.onclick=openAuth;toast('Logged out!')}}}else{b.innerText='Login';b.onclick=openAuth}}
function like(id,el){if(!user){openAuth();toast('Login first to like!');return}const p=posts.find(x=>x.id===id);const span=el.querySelector('span');if(likes.has(id)){likes.delete(id);p.likes--;el.classList.remove('liked');el.innerHTML=`🤍 <span>${p.likes}</span>`;toast('Unliked')}else{likes.add(id);p.likes++;el.classList.add('liked');el.innerHTML=`❤️ <span>${p.likes}</span>`;toast('Liked! ❤️');if(navigator.vibrate)navigator.vibrate(40)}save()}
function sharePost(id){const url='https://watchwellofficial.github.io/watchwell/?v='+id;navigator.clipboard.writeText(url).then(()=>toast('Link copied! 🔗')).catch(()=>{prompt('Copy link:',url)});if(navigator.share){navigator.share({title:'WatchWell',url}).catch(()=>{})}}
function openAuth(){document.getElementById('authM').classList.add('on')}function closeAuth(){document.getElementById('authM').classList.remove('on')}function setTab(t){tab=t;document.getElementById('tL').classList.toggle('on',t==='login');document.getElementById('tR').classList.toggle('on',t==='register');document.getElementById('nIn').style.display=t==='register'?'block':'none';document.getElementById('aT').innerText=t==='register'?'Sign Up':'Login';document.getElementById('aBtn').innerText=t==='register'?'Create Account':'Login'}
function doAuth(){const e=document.getElementById('eIn').value.trim();const pw=document.getElementById('pIn').value.trim();const n=document.getElementById('nIn').value.trim()||e.split('@')[0]||'User';if(!e||!pw){toast('Enter email & password');return}user={email:e,name:n};localStorage.setItem('ww_user',JSON.stringify(user));closeAuth();render();toast(tab==='register'?'Account created! ✅':'Welcome '+n+'! ✅')}
function openUp(){if(!user){openAuth();toast('Login first to upload!');return}document.getElementById('upM').classList.add('on')}function closeUp(){document.getElementById('upM').classList.remove('on')}document.getElementById('fIn').addEventListener('change',function(){const f=this.files[0];if(!f)return;const v=document.getElementById('pv');v.src=URL.createObjectURL(f);v.style.display='block';v.load();document.getElementById('drop').style.borderColor='#4f46e5'});function publish(){const title=document.getElementById('sIn').value||'My Shop';const desc=document.getElementById('dIn').value||'#watchwell';const f=document.getElementById('fIn');if(!f.files[0]){toast('Pick a video first!');return}const vid=URL.createObjectURL(f.files[0]);const np={id:Date.now().toString(),shop:title,desc:desc,likes:0,user:user.name,av:'https://i.pravatar.cc/150?u='+user.email,video:vid};posts.unshift(np);save();closeUp();render();toast('Published! 🚀');document.getElementById('sIn').value='';document.getElementById('dIn').value='';document.getElementById('fIn').value='';document.getElementById('pv').style.display='none'}
function openMsg(u){if(!user){openAuth();toast('Login to message!');return}curChat=u;document.getElementById('msgM').classList.add('on');document.getElementById('mName').innerText=u;const key='ww_chat_'+u;const history=JSON.parse(localStorage.getItem(key)||'[]');const base=`<div class="bub them">Hey! I saw your video 🔧</div>`;document.getElementById('mBody').innerHTML=base+history.map(m=>`<div class="bub ${m.me?'me':'them'}">${m.text}</div>`).join('');document.getElementById('mBody').scrollTop=9999}function closeMsg(){document.getElementById('msgM').classList.remove('on')}function sendMsg(){const inp=document.getElementById('mIn');const t=inp.value.trim();if(!t||!curChat)return;const key='ww_chat_'+curChat;const h=JSON.parse(localStorage.getItem(key)||'[]');h.push({text:t,me:true});localStorage.setItem(key,JSON.stringify(h));document.getElementById('mBody').insertAdjacentHTML('beforeend',`<div class="bub me">${t}</div>`);inp.value='';document.getElementById('mBody').scrollTop=9999;setTimeout(()=>{const rh=JSON.parse(localStorage.getItem(key)||'[]');rh.push({text:'Nice! 👍 Thanks for messaging',me:false});localStorage.setItem(key,JSON.stringify(rh));document.getElementById('mBody').insertAdjacentHTML('beforeend',`<div class="bub them">Nice! 👍 Thanks for messaging</div>`);document.getElementById('mBody').scrollTop=9999},800)}
render();document.getElementById('authM').addEventListener('click',e=>{if(e.target.id==='authM')closeAuth()});document.getElementById('upM').addEventListener('click',e=>{if(e.target.id==='upM')closeUp()})
</script></body></html>
